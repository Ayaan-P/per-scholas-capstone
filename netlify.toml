[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://per-scholas-capstone.onrender.com/api/:splat"
  status = 200
  force = true
